# Đây là khối cấu hình cho server web của bạn.
server {
  # Nginx sẽ lắng nghe các kết nối đến trên cổng 80.
  listen 80;

  # Thiết lập thư mục gốc chứa mã nguồn trang web.
  # Đây chính là thư mục mà chúng ta đã sao chép các file từ thư mục 'dist' vào trong Dockerfile.
  root /usr/share/nginx/html;

  # Khi người dùng truy cập vào một thư mục (ví dụ: yourdomain.com/),
  # Nginx sẽ tự động tìm và phục vụ file index.html.
  index index.html;

  # Cấu hình này rất quan trọng cho các ứng dụng trang đơn (Single Page App) như React.
  location / {
    # Nginx sẽ cố gắng tìm một file có tên khớp với URL request ($uri).
    # Nếu không tìm thấy, nó sẽ thử tìm một thư mục có tên đó ($uri/).
    # Nếu cả hai đều không tồn tại, nó sẽ chuyển hướng (fallback) request về file /index.html.
    # Điều này cho phép thư viện định tuyến (như React Router) xử lý URL ở phía client.
    try_files $uri $uri/ /index.html;
  }
}

